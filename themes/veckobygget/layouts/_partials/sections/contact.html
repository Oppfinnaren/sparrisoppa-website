<section class="section--dark dark"{{ with .Params.anchor }} id="{{ . }}"{{ end }}>
  <div class="section wrap contact">
    <div class="contact__head">
      <h2>{{ .Title }}</h2>
      <p>{{ .Params.text }}</p>
    </div>
    {{- partial "booking.html" . }}
    {{- with .Params.person }}
    <div class="person">
      {{- with .photo }}{{ with resources.Get . }}
      {{- $img := .Resize "176x webp q85" }}
      <img src="{{ $img.RelPermalink }}" width="88" height="88" alt="{{ $.Params.person.name }}" loading="lazy">
      {{- end }}{{ end }}
      <div class="person__text">
        <div class="person__name"><strong>{{ .name }}</strong><span>{{ .role }}</span></div>
        <p>{{ .text }}</p>
      </div>
    </div>
    {{- end }}
  </div>
</section>
