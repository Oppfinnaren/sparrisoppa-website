<section class="section--white"{{ with .Params.anchor }} id="{{ . }}"{{ end }}>
  <div class="section wrap faq">
    <h2 class="h2">{{ .Title }}</h2>
    <div class="faq__list">
      {{- range $i, $f := .Params.items }}
      <details{{ if eq $i 0 }} open{{ end }}>
        <summary>{{ $f.q }}</summary>
        <div class="md">{{ $f.a | markdownify }}</div>
      </details>
      {{- end }}
    </div>
  </div>
</section>
