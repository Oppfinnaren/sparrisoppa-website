{{- $js := resources.Get "js/site.js" }}
{{- if hugo.IsProduction }}{{ $js = $js | minify | fingerprint }}{{ end }}
<script src="{{ $js.RelPermalink }}"{{ with $js.Data.Integrity }} integrity="{{ . }}"{{ end }} defer></script>
{{- if and .IsHome site.Params.cal.link }}
{{- $cal := resources.Get "js/cal.js" }}
{{- if hugo.IsProduction }}{{ $cal = $cal | minify | fingerprint }}{{ end }}
<script src="{{ $cal.RelPermalink }}"{{ with $cal.Data.Integrity }} integrity="{{ . }}"{{ end }} defer></script>
{{- end }}
