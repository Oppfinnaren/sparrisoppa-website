<!doctype html>
<html lang="{{ site.Language.Locale | default "sv" }}" data-accent="{{ site.Params.accent | default "orange" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#main">{{ site.Params.skip_label | default "Hoppa till innehållet" }}</a>
  {{- partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- partial "scripts.html" . }}
</body>
</html>
