# Site settings. Content lives in content/, the look in themes/paper/.
baseURL = "https://sparrisoppa.github.io/website/"
locale = "en"
title = "Mathias Kallmert"
theme = "paper"

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  author = "Mathias Kallmert"
  description = "Software engineer with focus on creating refined products. Based in Stockholm."
  email = "mathias.kallmert@gmail.com"

  # Shown after the email in the footer and on the About page, in this order.
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/sparrisoppa"
  [[params.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/mathias-kallmert-66338ab2"

# Top menu, left to right.
[menus]
  [[menus.main]]
    name = "Index"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 20
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 40

[outputs]
  home = ["html"]
  section = ["html", "rss"]

[markup.highlight]
  noClasses = true
  style = "bw"

[minify.tdewolff.html]
  keepWhitespace = false
