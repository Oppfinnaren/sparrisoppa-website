# nginx site config. Copy to /etc/nginx/sites-available/yourname.se,
# symlink into sites-enabled, then get certificates with:
#   sudo certbot --nginx -d yourname.se -d www.yourname.se
# and reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name yourname.se www.yourname.se;
    # certbot replaces this with a redirect to HTTPS
    root /var/www/yourname.se;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yourname.se;

    # Managed by certbot
    ssl_certificate     /etc/letsencrypt/live/yourname.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourname.se/privkey.pem;

    root /var/www/yourname.se;
    index index.html;

    gzip on;
    gzip_types text/css application/xml application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprinted CSS and fonts never change; cache them for a year.
    location ~ ^/(css|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.yourname.se;
    ssl_certificate     /etc/letsencrypt/live/yourname.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourname.se/privkey.pem;
    return 301 https://yourname.se$request_uri;
}
